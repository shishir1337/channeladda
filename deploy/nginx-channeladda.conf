# /etc/nginx/sites-available/channeladda
#
#   sudo ln -s /etc/nginx/sites-available/channeladda /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Install this BEFORE running certbot. Certbot edits the TLS bits of this file
# in place; the listen 443 block below is what it fills in.

upstream channeladda_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Redirect every plain-HTTP request. Certbot adds its own version of this too;
# keeping one is enough.
server {
    listen 80;
    listen [::]:80;
    server_name channeladda.com www.channeladda.com;

    # Let certbot answer its challenge over HTTP before anything is redirected.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://channeladda.com$request_uri;
    }
}

# Send www to the bare domain, so a session cookie set on one origin is not
# missing on the other.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.channeladda.com;

    ssl_certificate     /etc/letsencrypt/live/channeladda.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/channeladda.com/privkey.pem;

    return 301 https://channeladda.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name channeladda.com;

    ssl_certificate     /etc/letsencrypt/live/channeladda.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/channeladda.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Told to the browser only over TLS, which is why it lives here and not in
    # next.config.ts. Start with a short max-age; raise it once you are sure
    # the certificate renews cleanly, because this is not reversible for
    # visitors who have already seen it.
    add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;

    # Uploads are user-supplied files. 8MB is the app's own limit; matching it
    # here means an oversized file is refused by nginx instead of being
    # streamed all the way into Node first.
    client_max_body_size 9M;

    # Proof screenshots and channel art compress poorly; HTML and JS do not.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/channeladda.access.log;
    error_log  /var/log/nginx/channeladda.error.log;

    # Immutable build assets. Everything under here has a content hash in its
    # name, so it can be cached hard and served without troubling Node.
    location /_next/static/ {
        alias /srv/channeladda/app/.next/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://channeladda_app;
        proxy_http_version 1.1;

        # Without these the app builds redirects from the internal address and
        # sends people to http://127.0.0.1:3000, and Better Auth rejects the
        # origin on sign-in.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
